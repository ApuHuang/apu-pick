[project]
name = "astro-light-selector"
dynamic = ["version"]
description = "天文 light frame 自動挑片"
requires-python = ">=3.10"
dependencies = ["astropy>=6.0", "numpy>=1.26", "photutils>=1.12", "scipy>=1.12"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
gui = ["matplotlib>=3.8"]
exe = ["matplotlib>=3.8", "pyinstaller>=6.0"]

[project.scripts]
astro-select = "astro_light_selector.cli:main"

[project.gui-scripts]
astro-select-gui = "astro_light_selector.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "astro_light_selector.__version__"}

[tool.setuptools.package-data]
astro_light_selector = ["assets/*.ico"]
