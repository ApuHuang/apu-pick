[project]
name = "apu-pick"
dynamic = ["version"]
description = "APU Pick (Astrophotography Pick Utility)：天文攝影 light frame 自動挑片"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["astropy>=6.0", "numpy>=1.26", "photutils>=1.12", "scipy>=1.12", "rawpy>=0.25", "exifread>=3.0"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
gui = ["matplotlib>=3.8"]
exe = ["matplotlib>=3.8", "pyinstaller>=6.0"]

[project.scripts]
apu-pick = "astro_light_selector.cli:main"

[project.gui-scripts]
apu-pick-gui = "astro_light_selector.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "astro_light_selector.__version__"}

[tool.setuptools.package-data]
astro_light_selector = ["assets/*.ico", "assets/*.png"]
